[package]
name = "kaburimake-checker-utils-rs"
version = "0.1.2"
edition = "2021"
authors = [ "tukinami seika" ]
license = "MIT"
readme = "README.md"
description = "Utility tool for kaburimake-checker-ts."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
serde_json = "1.0.154"
encoding_rs = "0.8.42"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
