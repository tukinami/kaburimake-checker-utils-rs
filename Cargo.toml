[package]
name = "kaburimake-checker-utils-rs"
version = "0.1.1"
edition = "2021"
authors = [ "tukinami seika" ]
license = "MIT"
readme = "README.md"
description = "Utility tool for kaburimake-checker-ts."

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
chrono = "0.4.42"
serde_json = "1.0.149"
encoding_rs = "0.8.35"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
tempfile = "3.24.0"
